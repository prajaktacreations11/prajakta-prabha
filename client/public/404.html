<!DOCTYPE html>
<html lang="mr">
  <head>
    <meta charset="utf-8" />
    <title>प्राजक्तप्रभा</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side rewrites, so it serves this file for any
      // unknown path (e.g. a hard refresh on /post/some-slug). This redirects the
      // browser back to index.html with the original path encoded in the query
      // string; the decode script in index.html restores it via history.replaceState
      // before the app mounts, so wouter's client-side router sees the real path.
      // Technique: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // keep the "/prajakta-prabha" GitHub Pages project segment

      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
