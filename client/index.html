<!DOCTYPE html>
<html lang="mr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="description" content="प्राजक्तप्रभा - A creative blog showcasing Marathi poetry, dance, and cultural expression. Explore original काव्य, articles, and उखाणे." />
    <!--
      Site-level share-preview defaults. Post pages get their own values two
      ways: client-side via useDocumentMeta (for a live SPA session) and, for
      crawlers that don't run JS, baked into a static file per post by
      scripts/prerender-posts.ts. The literal URLs below must stay in sync
      with client/src/lib/seo.ts's SITE_URL/DEFAULT_OG_IMAGE constants — this
      file is static markup, so it can't import them.
    -->
    <meta property="og:site_name" content="प्राजक्तप्रभा" />
    <meta property="og:title" content="प्राजक्तप्रभा - Marathi Creative Blog" />
    <meta property="og:description" content="Welcome to my blog, where I share my poetry, passion for dance, and more." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://prajaktacreations11.github.io/prajakta-prabha/" />
    <meta property="og:image" content="https://prajaktacreations11.github.io/prajakta-prabha/blog-images/about_section_portrait.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="प्राजक्तप्रभा - Marathi Creative Blog" />
    <meta name="twitter:description" content="Welcome to my blog, where I share my poetry, passion for dance, and more." />
    <meta name="twitter:image" content="https://prajaktacreations11.github.io/prajakta-prabha/blog-images/about_section_portrait.png" />
    <link rel="canonical" href="https://prajaktacreations11.github.io/prajakta-prabha/" />
    <link rel="alternate" type="application/rss+xml" title="प्राजक्तप्रभा RSS Feed" href="https://prajaktacreations11.github.io/prajakta-prabha/rss.xml" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@300;400;500;600;700;800&family=Tiro+Devanagari+Marathi:ital@0;1&family=Mukta:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>प्राजक्तप्रभा - Marathi Creative Blog</title>
    <script type="text/javascript">
      // Counterpart to public/404.html's redirect: restores the real path that was
      // encoded into the query string, before the app mounts and wouter reads the URL.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
